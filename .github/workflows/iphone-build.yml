name: Build SanPlan iPhone
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanplan-iphone
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile device app and run simulator tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcodebuild -showsdks > artifacts/sdks.txt
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-commit.txt
          xcodebuild -project SanPlan.xcodeproj -scheme SanPlan -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build > artifacts/device-build.log 2>&1 || { tail -n 100 artifacts/device-build.log; exit 1; }
          # An app with no compiled code still "builds"; refuse it.
          size=$(wc -c < build/device/Build/Products/Release-iphoneos/SanPlan.app/SanPlan)
          if [[ "$size" -lt 200000 ]]; then echo "App binary suspiciously small: $size bytes"; exit 1; fi
          # The alert tones ship flat in the bundle (three tones x four volume steps).
          ls build/device/Build/Products/Release-iphoneos/SanPlan.app/arna-tone-*.m4a > artifacts/bundled-tones.txt 2>/dev/null || true
          tones=$(wc -l < artifacts/bundled-tones.txt | tr -d ' ')
          if [[ "$tones" -ne 12 ]]; then echo "Expected 12 arna-tone-*.m4a in the app bundle, found $tones"; exit 1; fi
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/SanPlan.app build/package/Payload/
          # Unsigned builds carry no entitlements, so a sideloader re-signs without HealthKit. Seal the app ad hoc
          # with its entitlements (extensions first) so the sideloader sees and requests them.
          for ext in build/package/Payload/SanPlan.app/PlugIns/*.appex; do [[ -d "$ext" ]] && codesign --force --sign - "$ext"; done
          codesign --force --sign - --entitlements SanPlanSupport/SanPlan.entitlements build/package/Payload/SanPlan.app
          codesign -d --entitlements - --xml build/package/Payload/SanPlan.app > artifacts/app-entitlements.plist 2>/dev/null || codesign -d --entitlements :- build/package/Payload/SanPlan.app > artifacts/app-entitlements.plist
          grep -q "com.apple.developer.healthkit" artifacts/app-entitlements.plist || { echo "HealthKit entitlement missing from the packaged app"; exit 1; }
          (cd build/package && zip -qr ../../artifacts/SanPlan-unsigned.ipa Payload)
          shasum -a 256 artifacts/SanPlan-unsigned.ipa > artifacts/SHA256.txt
          xcrun simctl list devices available --json > artifacts/devices.json
          simulator=$(python3 -c 'import json; d=json.load(open("artifacts/devices.json")); candidates=[v["udid"] for k,vs in d["devices"].items() if "iOS-26" in k for v in vs if v.get("isAvailable") and v["name"].startswith("iPhone")]; assert candidates, "No iOS 26 iPhone simulator installed"; print(candidates[0])')
          xcodebuild -project SanPlan.xcodeproj -scheme SanPlan -destination "platform=iOS Simulator,id=$simulator" -derivedDataPath build/simulator -resultBundlePath artifacts/tests.xcresult CODE_SIGNING_ALLOWED=NO test > artifacts/tests.log 2>&1 || { tail -n 100 artifacts/tests.log; xcrun xcresulttool get test-results summary --path artifacts/tests.xcresult > artifacts/test-summary.json || true; xcrun xcresulttool get test-results tests --path artifacts/tests.xcresult > artifacts/test-details.json || true; for t in 'ARNAUITests/test07_WorkoutRunFromProgramWithRestTimer()' 'ARNAUITests/test08_SeededActiveWorkoutShowsControls()'; do n=$(echo "$t" | tr -c 'A-Za-z0-9_' '_'); xcrun xcresulttool get test-results activities --test-id "$t" --path artifacts/tests.xcresult > "artifacts/activities-$n.json" || true; done; xcrun xcresulttool export attachments --path artifacts/tests.xcresult --output-path artifacts/attachments || true; exit 1; }
          xcrun xcresulttool get test-results summary --path artifacts/tests.xcresult > artifacts/test-summary.json
          printf 'Device build and XCTest passed. IPA unsigned; Windows sideload signing required.\n' > artifacts/RESULT.txt
      - name: Capture native interface
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          simulator=$(python3 -c 'import json; d=json.load(open("artifacts/devices.json")); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS-26" in k for v in vs if v.get("isAvailable") and v["name"].startswith("iPhone")))')
          state=$(xcrun simctl list devices --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["state"] for vs in d["devices"].values() for v in vs if v["udid"]==sys.argv[1]))' "$simulator")
          if [[ "$state" != "Booted" ]]; then xcrun simctl boot "$simulator"; fi
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl install "$simulator" build/simulator/Build/Products/Debug-iphonesimulator/SanPlan.app
          xcrun simctl ui "$simulator" appearance dark
          xcrun simctl status_bar "$simulator" override --time '9:41' --batteryState charged --batteryLevel 100
          for scheme in dark light; do
            xcrun simctl ui "$simulator" appearance "$scheme"
            xcrun simctl launch --terminate-running-process "$simulator" com.sanplan.companion
            sleep 3
            xcrun simctl io "$simulator" screenshot "artifacts/login-$scheme.png"
            tab=0
            for name in today money plans workout notes; do
              xcrun simctl launch --terminate-running-process "$simulator" com.sanplan.companion --screenshot-signed-in --screenshot-tab "$tab"
              sleep 3
              xcrun simctl io "$simulator" screenshot "artifacts/$name-$scheme.png"
              tab=$((tab + 1))
            done
            for phase in preparing working alerting last; do
              xcrun simctl launch --terminate-running-process "$simulator" com.sanplan.companion --screenshot-signed-in --screenshot-tab 3 --screenshot-active-workout "$phase"
              sleep 3
              xcrun simctl io "$simulator" screenshot "artifacts/workout-$phase-$scheme.png"
            done
          done
      - name: Upload IPA and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SanPlan-iPhone
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
